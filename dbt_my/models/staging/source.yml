version: 2
sources:
  - name: rawdata_source
    database: TALABAT
    schema: RAW
    tables:
      - name: OLIST_CUSTOMER_DATASET
        description: "Olist customer records containing unique customer identifiers, zip code prefixes, city, and state information for each customer."
        columns:
          - name: customer_id
            tests:
              - unique
              - not_null
          - name: customer_unique_id
            tests:
              - not_null

      - name: OLIST_GEOLOCATION_DATASET
        description: "Geolocation lookup table mapping zip code prefixes to latitude, longitude, city, and state in Brazil."
        columns:
          - name: geolocation_zip_code_prefix
            tests:
              - not_null

      - name: OLIST_ORDERS_DATASET
        description: "Core orders table tracking the lifecycle of each order from purchase to delivery, including key timestamps and order status."
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
          - name: customer_id
            tests:
              - not_null
          - name: order_status
            tests:
              - not_null
          - name: order_purchase_timestamp
            tests:
              - not_null
          - name: order_estimated_delivery_date
            tests:
              - not_null

      - name: OLIST_ORDER_ITEMS_DATASET
        description: "Line-item details for each order, including product, seller, price, freight, and shipping deadlines."
        columns:
          - name: order_id
            tests:
              - not_null
          - name: order_item_id
            tests:
              - not_null
          - name: product_id
            tests:
              - not_null
          - name: seller_id
            tests:
              - not_null
          - name: shipping_limit_date
            tests:
              - not_null
          - name: price
            tests:
              - not_null
          - name: freight_value
            tests:
              - not_null

      - name: OLIST_ORDER_PAYMENTS_DATASET
        description: "Payment records for each order, including payment type, number of installments, and total payment value."
        columns:
          - name: order_id
            tests:
              - not_null
          - name: payment_sequential
            tests:
              - not_null
          - name: payment_type
            tests:
              - not_null
          - name: payment_installments
            tests:
              - not_null
          - name: payment_value
            tests:
              - not_null

      - name: OLIST_ORDER_REVIEWS_DATASET
        description: "Customer reviews and ratings submitted after order delivery, including score, title, message, and timestamps."
        columns:
          - name: review_id
            tests:
              - not_null
          - name: order_id
            tests:
              - not_null
          - name: review_score
            tests:
              - not_null

      - name: OLIST_PRODUCTS_DATASET
        description: "Product catalog with category, dimensions, weight, and photo count for each product sold on the platform."
        columns:
          - name: product_id
            tests:
              - unique
              - not_null

      - name: OLIST_SELLERS_DATASET
        description: "Seller records containing unique seller identifiers and location information (zip code prefix, city, state)."
        columns:
          - name: seller_id
            tests:
              - unique
              - not_null
